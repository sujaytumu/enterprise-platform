services:
  - type: web
    name: enterprise-platform-backend
    runtime: docker
    repo: https://github.com/sujaytumu/enterprise-platform
    branch: deploy-free-stack
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: enterprise-platform-frontend
    runtime: static
    repo: https://github.com/sujaytumu/enterprise-platform
    branch: deploy-free-stack
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
