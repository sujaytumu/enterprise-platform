# Render Blueprint for the consolidated platform:
#   enterprise-db       Postgres (free tier)
#   enterprise-backend  Spring Boot API, built from the root Dockerfile
#   enterprise-frontend React/Vite static site
#
# Database credentials are wired straight from the managed database into the
# backend's environment — no passwords live in this file or in the repo.
#
# HOW TO USE: Render dashboard -> New -> Blueprint -> connect this repo -> Apply.
# If Render assigns different hostnames than the ones below, update
# FRONTEND_ORIGIN (backend) and VITE_API_URL (frontend) in the dashboard.

databases:
  - name: enterprise-db
    plan: free
    databaseName: enterprise
    user: enterprise

services:
  - type: web
    name: enterprise-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PGHOST
        fromDatabase:
          name: enterprise-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: enterprise-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: enterprise-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: enterprise-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: enterprise-db
          property: password
      - key: FRONTEND_ORIGIN
        value: https://enterprise-frontend.onrender.com

  - type: web
    name: enterprise-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://enterprise-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
