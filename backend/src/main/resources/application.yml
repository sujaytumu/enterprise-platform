server:
  port: ${PORT:8080}

spring:
  application:
    name: enterprise-platform-backend
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:enterprise}
    username: ${PGUSER:postgres}
    # No default: the password must come from the environment (PGPASSWORD).
    password: ${PGPASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Public endpoint: report status only, don't leak DB/disk details.
      show-details: never
      probes:
        enabled: true
