server:
  port: ${PORT:8080}

spring:
  application:
    name: enterprise-platform-backend
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:enterprise}?sslmode=require
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

app:
  frontend-origin: ${FRONTEND_ORIGIN:*}
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration-hours: ${JWT_EXPIRATION_HOURS:24}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
